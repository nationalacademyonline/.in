<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralised Examination Result - Class 9 & Class 10 Portal</title>
    <meta name="description" content="Official Centralised Examination Result Portal for Class 9 and Class 10 Secondary Education. Search by Roll Number and Date of Birth.">

    <!-- Google Fonts & FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Design System -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Dynamic Animated Background Orbs -->
    <div class="bg-glow-backdrop">
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>
    </div>

    <!-- Application Main Container -->
    <div class="app-container">

        <!-- Top Navigation Bar -->
        <nav class="navbar">
            <a href="#" class="brand-logo" onclick="location.reload();">
                <div class="brand-icon">
                    <i class="fas fa-award"></i>
                </div>
                <div>
                    <div class="brand-title">Centralised Examination Result</div>
                    <div style="font-size: 0.72rem; color: var(--accent-cyan); font-weight: 600; letter-spacing: 0.05em;">SECONDARY BOARD (CLASS IX & CLASS X)</div>
                </div>
            </a>

            <div style="display: flex; align-items: center; gap: 1rem;">
                <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Dark/Light Mode">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </nav>

        <!-- ===================================================================
             MAIN STUDENT RESULT SEARCH
             =================================================================== -->
        <div id="searchPage" class="page-view active">
            <section class="hero-section">
                <div class="hero-badge">
                    <i class="fas fa-certificate"></i> SECONDARY SCHOOL EXAMINATION RESULT
                </div>
                <h1 class="hero-title">Centralised Examination Result</h1>
                <p class="hero-subtitle">Select your Date of Birth (DOB) using the calendar system and enter your numeric Roll Number to access your official secondary result certificate.</p>

                <div class="search-card">
                    <form id="resultSearchForm" class="search-form" style="flex-direction: column;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; width: 100%;">
                            <!-- Roll Number Input (Digits Only) -->
                            <div class="search-input-group">
                                <i class="fas fa-hashtag"></i>
                                <input type="text" id="rollSearchInput" class="search-input"
                                    placeholder="Roll No. (e.g. 2224865)" pattern="[0-9]+"
                                    title="Roll number must contain digits only" required autocomplete="off">
                            </div>

                            <!-- Interactive Calendar System for DOB Selection -->
                            <div class="search-input-group">
                                <i class="fas fa-calendar-alt"></i>
                                <input type="date" id="dobSearchInput" class="search-input"
                                    title="Select Date of Birth from Calendar System" required>
                            </div>
                        </div>

                        <div style="margin-top: 0.85rem;">
                            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">
                                <i class="fas fa-search"></i> Check Secondary Result
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </div>

    </div>

    <!-- Algorithm Script -->
    <script>
        // Theme Toggle Handler
        const themeBtn = document.getElementById('themeToggleBtn');
        const savedTheme = localStorage.getItem('cer_theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
        }
        if (themeBtn) {
            themeBtn.addEventListener('click', () => {
                document.body.classList.toggle('light-theme');
                const isLight = document.body.classList.contains('light-theme');
                localStorage.setItem('cer_theme', isLight ? 'light' : 'dark');
                themeBtn.innerHTML = isLight ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
            });
        }

        // Direct URL Generation Algorithm Handler
        document.getElementById('resultSearchForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const roll = document.getElementById('rollSearchInput').value.trim();
            const dob = document.getElementById('dobSearchInput').value;

            if (!roll || roll.length < 4 || !/^\d+$/.test(roll)) {
                alert('Please enter a valid numeric Roll Number.');
                return;
            }

            if (!dob) {
                alert('Please select your Date of Birth.');
                return;
            }

            // Extract last 4 digits of Roll Number
            const last4Roll = roll.slice(-4);

            // Extract last 2 digits of DOB Year (from YYYY-MM-DD input date)
            const year = dob.split('-')[0];
            const last2Year = year.slice(-2);

            // Combine last 4 digits of Roll + last 2 digits of Year
            const pdfCode = last4Roll + last2Year;

            // Final PDF Download URL
            const finalUrl = `https://raw.githubusercontent.com/nationalacademyonline/.in/main/CER/Result_PDFs/${pdfCode}.pdf`;

            // Redirect / Open target PDF URL
            const win = window.open(finalUrl, '_blank');
            if (!win) {
                window.location.href = finalUrl;
            }
        });
    </script>
</body>

</html>
